version: '1'
serverUrl: ${env.POLARIS_URL}
install:
  coverity:
    version: default
project:
  organization: osisoft
  name: ${env.POLARIS_PROJECT_NAME}
  branch: ${scm.git.branch}
  revision:
    name: ${scm.git.commit}
    date: ${scm.git.commit.date}
  groups:
    "${env.POLARIS_GROUP_NAME}": Administrator
capture:
  fileSystem:
    python:
      extensions: [py]
      files:
        - directory: .
analyze:
  mode: central
